[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlvt"
version = "2.2.0rc2"
description = "A formal model of enacted leadership scope, coordination load, and vitality"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "William Bendinelli"}
]
keywords = ["dynamical-systems", "leadership", "vitality", "coordination-load", "formal-theory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
]

[project.urls]
Homepage = "https://github.com/wbendinelli/dlvt"
Documentation = "https://github.com/wbendinelli/dlvt#readme"
Repository = "https://github.com/wbendinelli/dlvt"
"Bug Tracker" = "https://github.com/wbendinelli/dlvt/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dlvt"]
exclude = ["notebooks", "scripts", "tests", "*.tests"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | notebooks
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
